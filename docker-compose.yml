version: '3.8'

services:
  # PostgreSQL Database (external connection supported via env vars)
  postgres:
    image: postgres:15-alpine
    container_name: ai_generator_db
    environment:
      POSTGRES_USER: ${DB_USER:-aiuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aipassword}
      POSTGRES_DB: ${DB_NAME:-aigenerator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiuser} -d ${DB_NAME:-aigenerator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: ai_generator_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: ai_generator_minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secure_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Initialize MinIO Bucket
  createbuckets:
    image: minio/mc:latest
    container_name: ai_generator_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minio_admin} ${S3_SECRET_KEY:-minio_secure_password};
      mc mb myminio/bx-images --ignore-existing;
      mc anonymous set download myminio/bx-images;
      exit 0;
      "
    networks:
      - ai_network

  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_generator_api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-aiuser}:${DB_PASSWORD:-aipassword}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-aigenerator}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secure_password}
      S3_BUCKET: bx-images
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BITRIX24_CLIENT_ID: ${BITRIX24_CLIENT_ID}
      BITRIX24_CLIENT_SECRET: ${BITRIX24_CLIENT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ai_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # AI Worker for async tasks
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_generator_worker
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-aiuser}:${DB_PASSWORD:-aipassword}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-aigenerator}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secure_password}
      S3_BUCKET: bx-images
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BITRIX24_CLIENT_ID: ${BITRIX24_CLIENT_ID}
      BITRIX24_CLIENT_SECRET: ${BITRIX24_CLIENT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ai_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_generator_frontend
    environment:
      VITE_API_URL: /api
    networks:
      - ai_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai_generator_nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - ai_network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ai_generator_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - ai_network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ai_generator_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - ai_network
    restart: unless-stopped

  # Cloudflare Tunnel for Webhook Testing (Optional)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ai_generator_cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - ai_network
    restart: unless-stopped
    profiles:
      - webhook-test

networks:
  ai_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
