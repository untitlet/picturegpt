version: '3.8'

services:
  # PostgreSQL Database (external connection supported via env vars)
  postgres:
    image: postgres:15-alpine
    container_name: ai_generator_db
    environment:
      POSTGRES_USER: ${DB_USER:-aiuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aipassword}
      POSTGRES_DB: ${DB_NAME:-aigenerator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiuser} -d ${DB_NAME:-aigenerator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: ai_generator_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_generator_api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-aiuser}:${DB_PASSWORD:-aipassword}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-aigenerator}
      REDIS_URL: redis://redis:6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BITRIX24_CLIENT_ID: ${BITRIX24_CLIENT_ID}
      BITRIX24_CLIENT_SECRET: ${BITRIX24_CLIENT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_PATH: /app/storage
      PORT: 3000
    volumes:
      - app_storage:/app/storage
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_network
    restart: unless-stopped

  # AI Worker for async tasks
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_generator_worker
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-aiuser}:${DB_PASSWORD:-aipassword}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-aigenerator}
      REDIS_URL: redis://redis:6379
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BITRIX24_CLIENT_ID: ${BITRIX24_CLIENT_ID}
      BITRIX24_CLIENT_SECRET: ${BITRIX24_CLIENT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_PATH: /app/storage
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_network
    restart: unless-stopped

  # Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_generator_frontend
    environment:
      VITE_API_URL: /api
    networks:
      - ai_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai_generator_nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - app_storage:/var/www/storage:ro
    depends_on:
      - api
      - frontend
    networks:
      - ai_network
    restart: unless-stopped

networks:
  ai_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_storage:
